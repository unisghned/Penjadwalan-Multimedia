<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Multimedia</title>
    <script>document.documentElement.classList.toggle('dark', (localStorage.getItem('theme') || 'dark') === 'dark');</script>
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="scripts/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <main class="page-shell">
        <nav class="topbar" aria-label="Navigasi utama">
            <a class="wordmark" href="index.html"><img class="brand-logo" src="assets/logo.png" alt=""> Multimedia Team</a>
            <div class="topbar-right">
                <button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Aktifkan tema terang" title="Aktifkan tema terang">☀</button>
            </div>
        </nav>

        <header class="hero">
            <p class="eyebrow">Saint Martinus · Pelayanan Liturgi</p>
            <h1>MISA <span>SCHEDULE</span></h1>
            <div class="hero-meta"><span class="live-dot" aria-hidden="true"></span><span>Waktu sekarang</span><time id="realtime-clock">--:--:--</time></div>
        </header>

        <section class="schedule-section" aria-labelledby="schedule-title">
            <div class="section-heading">
                <h2 id="schedule-title">Jadwal Pelayanan</h2>
                <p id="schedule-count">Memuat jadwal</p>
            </div>
            <div id="guest-schedule-list" class="schedule-list" aria-live="polite"></div>
        </section>

        <footer class="footer">
            <span>Multimedia Team · Saint Martinus</span>
        </footer>
    </main>

    <script src="scripts/script.js"></script>
</body>
</html>
